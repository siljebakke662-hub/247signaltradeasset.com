<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | 247SignalTradeAsset</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #071c1b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0d2927;
      padding: 32px 25px;
      border-radius: 18px;
      border: 1px solid #1d4844;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9eb5b2;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce9e7;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #315652;
      background: #081f1d;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #42c7b8;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2bbbad;
      color: #06201e;
      font-weight: 800;
      cursor: pointer;
      font-size: 16px;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      color: #9eb5b2;
      font-size: 14px;
    }

    .links a {
      color: #42c7b8;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #9eb5b2;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">247SignalTradeAsset</div>

    <div class="subtitle">
      Secure account access
    </div>

    <form>
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Sign In</button>
    </form>

    <div class="links">
      Don't have an account?
      <a href="register.html">Create account</a>
    </div>

    <a class="back" href="index.html">
      ← Back to website
    </a>

  </div>

</body>
</html>
