<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | 247SignalTradeAsset</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #071c1b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 450px;
      background: #0d2927;
      padding: 32px 25px;
      border-radius: 18px;
      border: 1px solid #1d4844;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9eb5b2;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 10px;
      border: 1px solid #315652;
      background: #081f1d;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #42c7b8;
    }

    .terms {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 20px;
      color: #a8bfbc;
      font-size: 13px;
      line-height: 1.4;
    }

    .terms input {
      width: auto;
      margin: 3px 0 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2bbbad;
      color: #06201e;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #9eb5b2;
      font-size: 14px;
    }

    .login a {
      color: #42c7b8;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #9eb5b2;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h1>Create Account</h1>

    <div class="subtitle">
      Open your 247SignalTradeAsset account
    </div>

    <form>

      <label for="name">Full name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label for="confirm-password">Confirm password</label>
      <input
        type="password"
        id="confirm-password"
        placeholder="Confirm your password"
        required
      >

      <div class="terms">
        <input type="checkbox" id="terms" required>

        <label for="terms">
          I agree to the platform's Terms of Service,
          Privacy Policy and Risk Disclosure.
        </label>
      </div>

      <button type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Sign in</a>
    </div>

    <a class="back" href="index.html">
      ← Back to website
    </a>

  </div>

</body>
</html>
